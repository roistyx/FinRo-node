<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disco</title>
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        font-family: "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(circle at top, #6c5ce7, #341f97);
        color: #ffffff;
      }

      .card {
        text-align: center;
        background: rgba(0, 0, 0, 0.35);
        padding: 2.5rem 3rem;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(6px);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 2.5rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Disco</h1>
      <p>Spin up the lights and let the vibe roll.</p>
    </div>
  </body>
</html>
